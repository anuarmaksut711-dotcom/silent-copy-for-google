<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Google Code Cleaner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="header">
      <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg></span>
      <div><h1>Чистый код</h1><p class="subtitle">Google и Gemini</p></div>
    </header>

    <section class="automatic" aria-label="Автокопирование">
      <label class="toggle" for="enabled"><span>Автокопирование</span><input id="enabled" type="checkbox" role="switch" aria-label="Копировать автоматически" checked disabled></label>
      <p class="hint">Новый код заменяет буфер обмена.</p>
    </section>

    <div class="settings">
      <div class="setting"><label for="mode">Блоки кода</label><select id="mode" disabled><option value="last">Последний блок</option><option value="all">Все по порядку</option></select></div>
      <p class="mode-note" id="mode-note" hidden>Все блоки копируются одним текстом.</p>
      <div class="setting"><label for="delay">Пауза</label><select id="delay" title="Ожидание после последнего изменения кода" disabled><option value="1800">1,8 секунды</option><option value="3000">3 секунды</option><option value="5000">5 секунд</option></select></div>
    </div>

    <button id="copy" type="button" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span id="copy-label">Скопировать сейчас</span></button>
    <p id="status" role="status" aria-live="polite" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
